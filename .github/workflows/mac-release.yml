name: Mac release package

# Builds Shiny Tracker Overlay for Apple Silicon Macs for a PUBLISHED release
# and attaches it to that same release, beside the Windows ZIP and the Linux
# tarball. Same shape as linux-release.yml (and Kaizen's mac-release.yml).
#
# Started automatically by the source repo's packaging/publish_release.py after
# each Windows publish. By hand:
#
#   gh workflow run mac-release.yml --repo KaizenMMO/shinytracker-builds \
#     -f source_sha=<pushed commit in ShinyTrackerOverlay> -f release_tag=v3.12
#
# What it leaves on the release:
#   ShinyTrackerOverlay-Mac-AppleSilicon.dmg (+ .sha256) -- ONE FIXED NAME, so
#     releases/latest/download/ShinyTrackerOverlay-Mac-AppleSilicon.dmg
#     is a permanent link to the newest Mac build.
#   manifest.json gains a "mac" entry. Mac copies of the app read only that
#     entry; Windows clients read the top level, Linux its "linux" entry.
#   A "## Mac" section in the release notes, between markers.
#
# UNSIGNED PREVIEW: there is no Apple Developer account, so the app is signed
# ad-hoc only and players allow it once with "Open Anyway" (README-MAC.txt).
#
# Free: this repo is public, and public repos do not use Actions minutes
# (macOS runners included). macos-15 = Apple Silicon (arm64); macos-14 was
# refused from 2026-11-06. The deployment target keeps the app runnable on
# macOS 13 as its Info.plist promises.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact ShinyTrackerOverlay commit (must be pushed)
        required: true
        type: string
      release_tag:
        description: Published release tag to attach to, e.g. v3.12
        required: true
        type: string
      run_tests:
        description: Run the full suite before building
        required: false
        default: true
        type: boolean
      tests_only:
        description: Stop after the tests (diagnosis; touches no release)
        required: false
        default: false
        type: boolean
      test_build:
        description: Tester build - attach only to a PRE-release tag; no manifest, no notes
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mac-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: source
    env:
      QT_QPA_PLATFORM: offscreen
      SHINY_TRACKER_UPDATE: "0"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      STABLE_NAME: ShinyTrackerOverlay-Mac-AppleSilicon.dmg
    steps:
      - name: Check out the source commit
        uses: actions/checkout@v4
        with:
          repository: KaizenMMO/ShinyTrackerOverlay
          ref: ${{ inputs.source_sha }}
          # The same READ-ONLY deploy key linux-release.yml uses.
          ssh-key: ${{ secrets.SHINYTRACKER_SOURCE_SSH_KEY }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            source/requirements.txt
            source/requirements-dev.txt
      - name: Install Tesseract
        run: |
          brew install tesseract
          tesseract --version | head -1
          tesseract --list-langs | grep -qx eng
      - name: Install Python dependencies
        # RapidOCR --no-deps, exactly as on Windows/Linux: it declares the GUI
        # opencv-python, which must not sit beside the headless one.
        run: |
          grep -v '^rapidocr' requirements.txt > "$RUNNER_TEMP/requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements.txt" -r requirements-dev.txt
          python -m pip install --no-deps "$(grep -E '^rapidocr_onnxruntime==' requirements.txt | cut -d';' -f1 | tr -d ' ')"
          python -c "import platform, cv2, rapidocr_onnxruntime, onnxruntime, PySide6; print(platform.machine(), 'cv2', cv2.__version__, 'PySide6', PySide6.__version__)"
      - name: Check the release matches this source
        run: |
          version=$(python -c "from src.app_info import APP_VERSION; print(APP_VERSION)")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "${{ inputs.tests_only }}" = "true" ]; then
            exit 0
          fi
          if [ "${{ inputs.test_build }}" = "true" ]; then
            pre=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)
            if [ "$pre" != "true" ]; then
              echo "::error::test builds attach only to a pre-release; $RELEASE_TAG is not one"
              exit 1
            fi
            exit 0
          fi
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Source is v$version but the release tag is $RELEASE_TAG"
            exit 1
          fi
          state=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease -q '"\(.isDraft) \(.isPrerelease)"')
          if [ "$state" != "false false" ]; then
            echo "::error::$RELEASE_TAG must be a published, non-prerelease release (draft prerelease: $state)"
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx manifest.json \
            || { echo "::error::$RELEASE_TAG has no manifest.json; publish the Windows build first"; exit 1; }
      - name: Test
        if: ${{ inputs.run_tests || inputs.tests_only }}
        # -v names every test as it starts, so a hang's last line is the test;
        # faulthandler dumps every thread at 5 min of silence. macOS has no
        # `timeout`, so the step limit stops a hang here.
        timeout-minutes: 30
        run: python -X faulthandler -m unittest discover -s tests -v
      - name: Build, sign ad-hoc and smoke-test the app
        if: ${{ !inputs.tests_only }}
        timeout-minutes: 30
        run: python tools/build_unix.py
      - name: Package under the permanent name
        if: ${{ !inputs.tests_only }}
        run: |
          cd dist/release
          cp "ShinyTrackerOverlay-$VERSION-Mac-arm64.dmg" "$STABLE_NAME"
          shasum -a 256 "$STABLE_NAME" > "$STABLE_NAME.sha256"
          cat "$STABLE_NAME.sha256"
          ls -l "$STABLE_NAME"
      - name: Attach to the release and verify the public download
        if: ${{ !inputs.tests_only }}
        timeout-minutes: 10
        run: |
          gh release upload "$RELEASE_TAG" "dist/release/$STABLE_NAME" "dist/release/$STABLE_NAME.sha256" \
            --clobber --repo "$GITHUB_REPOSITORY"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$STABLE_NAME"
          curl -fsSL -H 'Cache-Control: no-cache' "$url?verify=$(date +%s)" -o "$RUNNER_TEMP/public.dmg"
          cmp "$RUNNER_TEMP/public.dmg" "dist/release/$STABLE_NAME"
          echo "PACKAGE_URL=$url" >> "$GITHUB_ENV"
          echo "Public download verified: $url"
      - name: Add the mac entry to manifest.json
        if: ${{ !inputs.tests_only && !inputs.test_build }}
        timeout-minutes: 10
        # The Linux and Mac workflows both edit manifest.json, minutes apart.
        # Each one re-reads the newest manifest right before writing (so it
        # keeps the other's entry) and checks afterwards that its own entry
        # survived, redoing the edit if a simultaneous write dropped it.
        run: |
          for attempt in 1 2 3 4 5; do
          mkdir -p "$RUNNER_TEMP/manifest"
          gh release download "$RELEASE_TAG" -p manifest.json -D "$RUNNER_TEMP/manifest" --clobber --repo "$GITHUB_REPOSITORY"
          python - "$RUNNER_TEMP/manifest/manifest.json" "dist/release/$STABLE_NAME" <<'PY'
          import hashlib, json, os, sys
          manifest_path, package = sys.argv[1], sys.argv[2]
          manifest = json.load(open(manifest_path, encoding="utf-8"))
          version = os.environ["VERSION"]
          if manifest.get("version") != version:
              sys.exit(f"manifest.json is v{manifest.get('version')}, not v{version}")
          digest = hashlib.sha256(open(package, "rb").read()).hexdigest()
          manifest["mac"] = {"version": version, "url": os.environ["PACKAGE_URL"],
                             "sha256": digest, "size": os.path.getsize(package)}
          json.dump(manifest, open(manifest_path, "w", encoding="utf-8"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/manifest/manifest.json" --clobber --repo "$GITHUB_REPOSITORY"
          sleep 30
          rm -rf "$RUNNER_TEMP/check" && mkdir -p "$RUNNER_TEMP/check"
          gh release download "$RELEASE_TAG" -p manifest.json -D "$RUNNER_TEMP/check" --clobber --repo "$GITHUB_REPOSITORY"
          if python -c "import json,sys,os; m=json.load(open(sys.argv[1])); sys.exit(0 if m.get('mac',{}).get('version')==os.environ['VERSION'] else 1)" "$RUNNER_TEMP/check/manifest.json"; then
            exit 0
          fi
          echo "::warning::manifest lost the mac entry (attempt $attempt); retrying"
          done
          echo "::error::could not keep the mac entry in manifest.json"
          exit 1
      - name: Add the Mac instructions to the release notes
        if: ${{ !inputs.tests_only && !inputs.test_build }}
        timeout-minutes: 5
        # Between markers, so a re-run REPLACES the section. The Linux and Mac
        # workflows edit the same notes; each checks its section survived.
        run: |
          for attempt in 1 2 3 4; do
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/body.md"
          python - "$RUNNER_TEMP/body.md" <<'PY'
          import re, sys
          path = sys.argv[1]
          body = open(path, encoding="utf-8").read()
          start, end = "<!-- mac-start -->", "<!-- mac-end -->"
          body = re.sub(re.escape(start) + r".*?" + re.escape(end), "", body, flags=re.S).rstrip()
          section = f"""{start}
          ## Mac (preview)

          **[Download for Mac (Apple Silicon)](https://github.com/KaizenMMO/shinytracker-builds/releases/latest/download/ShinyTrackerOverlay-Mac-AppleSilicon.dmg)**, always the newest version. M1 or newer, macOS 13 or later.

          1. Open the download and drag ShinyTrackerOverlay onto Applications.
          2. The first time, macOS stops it: go to System Settings > Privacy & Security and press **Open Anyway** (the app is not registered with Apple).
          3. Allow **Screen Recording** when asked, then open the app again. If Tesseract is missing, the app shows the Homebrew command with a Copy button.

          Full instructions are in `README-MAC.txt` inside the download.
          {end}"""
          open(path, "w", encoding="utf-8").write(body + "\n\n" + section + "\n")
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/body.md"
          sleep 30
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | grep -c "mac-start" | grep -qx 1; then
            exit 0
          fi
          echo "::warning::release notes lost the section (attempt $attempt); retrying"
          done
          echo "::error::could not keep the release-notes section"
          exit 1
      - name: Verify what clients will read
        if: ${{ !inputs.tests_only && !inputs.test_build }}
        timeout-minutes: 10
        run: |
          curl -fsSL -H 'Cache-Control: no-cache' \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/manifest.json?verify=$(date +%s)" \
            | python -c "import json,sys; m=json.load(sys.stdin); assert m['mac']['version']==m['version'], m; print('manifest ok:', m['version'], m['mac']['url'])"
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          if [ "$latest" = "$RELEASE_TAG" ]; then
            curl -fsSIL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$STABLE_NAME" | grep -i '^location' | tail -1
            echo "Permanent link serves $RELEASE_TAG"
          else
            echo "::warning::$RELEASE_TAG is not the latest release ($latest), so the permanent link does not serve it"
          fi
